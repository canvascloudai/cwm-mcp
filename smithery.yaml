name: cloud-world-model
description: Simulate cloud infrastructure and estimate cost before deploying or changing infrastructure. Model AWS, GCP, Azure, OCI, and DigitalOcean workloads with cost, latency, errors, and resilience estimates. Includes reinforcement learning environments, chaos experiments, multi-cloud comparisons, predictive scaling, and AI-backed analysis. MCP and REST are access interfaces; x402 is payment for eligible REST requests.
vendor: Canvas Cloud AI
homepage: https://www.cloudworldmodel.ai
license: MIT

startCommand:
  type: http
  url: https://www.cloudworldmodel.ai/mcp

configSchema:
  type: object
  properties:
    apiKey:
      type: string
      title: Cloud World Model API Key
      description: Optional API key to unlock all 63 authenticated tools. Without a key, 9 keyless demo tools are available.
      x-from:
        header: cwm-api-key
      x-to:
        header: x-api-key
  required: []
